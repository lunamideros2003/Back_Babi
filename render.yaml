services:
  - type: web
    name: back-babi
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://fron-babi.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: auto
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: qwen/qwen3.8-27b
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
